# SPDX-License-Identifier: Apache-2.0
#
# One-shot registry maintenance: deprecate the two npm names this package
# supersedes. Manual dispatch only — dispatching IS the confirmation.
#
# Why a workflow instead of a local `npm deprecate`: the workspace's local npm
# token has been dead since 2026-08-23 (401), and publishing/maintenance for
# this family runs on each repository's NPM_TOKEN secret. The token is written
# straight into NPM_CONFIG_USERCONFIG rather than expanded through
# ${NODE_AUTH_TOKEN}, matching the release step's established workaround.
name: Deprecate retired packages

on:
  workflow_dispatch:

jobs:
  deprecate:
    runs-on: ubuntu-latest
    steps:
      - name: Deprecate the two retired names
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NPM_TOKEN}" ]; then
            echo "NPM_TOKEN secret is not set"; exit 1
          fi
          umask 077
          printf '//registry.npmjs.org/:_authToken=%s\n' "${NPM_TOKEN}" > "$RUNNER_TEMP/.npmrc"
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/.npmrc"

          echo "== before =="
          npm view dsh-plugin-upgrade dist-tags.latest
          npm view dsh-plugin-upgrade-rc1 dist-tags.latest

          msg="Superseded by dsh-plugin-upgrade-015 — the merged corridor 0.1.3-alpha.1 -> 0.1.5-rc.1. Install dsh-plugin-upgrade-015 instead."
          npm deprecate dsh-plugin-upgrade "$msg"
          npm deprecate dsh-plugin-upgrade-rc1 "$msg"

          echo "== after =="
          npm view dsh-plugin-upgrade deprecated
          npm view dsh-plugin-upgrade-rc1 deprecated
